worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # --- Load Balancer ---
    # Cada bloque upstream define las instancias de un servicio. El nombre
    # (order-service, ...) resuelve por DNS de Docker a las 3 réplicas, y nginx
    # las agrega todas al upstream y las reparte en round robin.
    # Para escalar: docker compose up -d --scale order-service=N

    upstream order_service {
        zone order_service 64k;   # memoria compartida entre workers: reparto parejo
        server order-service:8081;
    }

    upstream price_service {
        zone price_service 64k;   # memoria compartida entre workers: reparto parejo
        server price-service:8082;
    }

    upstream user_service {
        zone user_service 64k;   # memoria compartida entre workers: reparto parejo
        server user-service:8083;
    }

    upstream notification_service {
        server notification-service:8084;
    }

    # API de Consul para service discovery
    upstream consul {
        server consul:8500;
    }

    # --- Servidor principal ---
    server {
        listen 8080;

        # CORS para que el frontend pueda hacer peticiones
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Preflight OPTIONS — responde sin llegar al backend
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Expone qué réplica atendió (IP:puerto del upstream) para ver el reparto.
        # Además, cada backend manda su propio X-Instance con su hostname.
        add_header X-Upstream $upstream_addr always;

        # --- Reverse Proxy ---

        location /orders {
            proxy_pass http://order_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        location /prices {
            proxy_pass http://price_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        location /users {
            proxy_pass http://user_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # Bitacora de eventos de Kafka (notification-service)
        location /events {
            proxy_pass http://notification_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # Health check del gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # Service discovery — consulta Consul y devuelve los servicios registrados
        location /services {
            proxy_pass http://consul/v1/agent/services;
            proxy_set_header Host $host;
        }
    }
}
