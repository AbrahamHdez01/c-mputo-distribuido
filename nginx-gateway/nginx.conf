worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # --- Load Balancer ---
    # Cada bloque upstream define las instancias de un servicio.
    # Para escalar solo hay que agregar mas lineas "server".

    upstream order_service {
        server order-service:8081;
    }

    upstream price_service {
        server price-service:8082;
    }

    upstream user_service {
        server user-service:8083;
    }

    # --- Servidor principal ---
    server {
        listen 8080;

        # CORS para que el frontend pueda hacer peticiones
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Preflight OPTIONS — responde sin llegar al backend
        if ($request_method = OPTIONS) {
            return 204;
        }

        # --- Reverse Proxy ---
        # Cada location redirige al upstream correspondiente

        location /orders {
            proxy_pass http://order_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        location /prices {
            proxy_pass http://price_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        location /users {
            proxy_pass http://user_service;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # Health check del gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # Service discovery — lista los upstreams configurados
        location /services {
            default_type application/json;
            return 200 '{"services":["order-service:8081","price-service:8082","user-service:8083"]}';
        }
    }
}
