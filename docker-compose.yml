services:

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx-gateway
    networks:
      - mercado-net

  # ── Nginx Gateway (Reverse Proxy + Load Balancer) ──────────────────────────
  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8080:8080"
    # Esperamos a que las 3 réplicas de cada backend estén sanas: nginx resuelve
    # el DNS UNA vez al arrancar, y si arranca antes se queda con una sola IP.
    depends_on:
      order-service:
        condition: service_healthy
      price-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - mercado-net

  # ── Consul (Service Discovery) ─────────────────────────────────────────────
  consul:
    image: hashicorp/consul:1.18
    container_name: consul
    ports:
      - "8500:8500"     # UI y API de Consul en http://localhost:8500
    command: agent -dev -client=0.0.0.0 -ui
    networks:
      - mercado-net

  # ── Kafka (broker en modo KRaft, sin Zookeeper) ────────────────────────────
  # Un solo contenedor hace de broker Y de controller, suficiente para el
  # simulador. Dos listeners:
  #   kafka:9092       → interno, lo usan los microservicios
  #   localhost:9094   → externo, para probar desde la terminal del host
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      # Al ser un solo broker, todo lleva factor de replicación 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Kafka tarda en estar listo; nadie arranca hasta que esto pase
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - mercado-net

  # ── Kafka Init (crea los tópicos y se apaga) ───────────────────────────────
  # Contenedor de un solo uso: deja los 4 tópicos creados con 3 particiones
  # antes de que los servicios arranquen, así no se autocrean con 1 partición.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        KT=$$(command -v kafka-topics.sh || echo /opt/kafka/bin/kafka-topics.sh)
        for t in orders.created orders.filled prices.updated users.registered; do
          $$KT --bootstrap-server kafka:9092 --create --if-not-exists \
               --topic $$t --partitions 3 --replication-factor 1
        done
        echo "──────── Tópicos del simulador ────────"
        $$KT --bootstrap-server kafka:9092 --list
    networks:
      - mercado-net

  # ── Kafka UI (ver tópicos, mensajes y colas en el navegador) ───────────────
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"     # http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: simulador-mercado
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mercado-net

  # ── Go Gateway (gRPC Load Balancer) ───────────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8090:8080"   # gateway gRPC-proxy en :8090 (separado del nginx-gateway)
    depends_on:
      order-service:
        condition: service_healthy
      price-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - mercado-net

  # ── PostgreSQL (la DB ÚNICA del diagrama) ──────────────────────────────────
  # Las 9 réplicas de los backends apuntan a esta misma base. El esquema y los
  # datos semilla los crea db/init.sql la primera vez que arranca el volumen.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado
      POSTGRES_DB: mercado
    ports:
      - "5432:5432"     # para inspeccionar con psql desde el host
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mercado-net

  # ── Backends: 3 réplicas de cada uno (el "x3" del diagrama) ────────────────
  # Sin container_name (Docker no permite nombres repetidos). El nombre del
  # servicio resuelve por DNS a las 3 IPs, y ahí reparten NGINX / el gateway.
  # Los puertos son un RANGO: cada réplica toma uno, para probarlas con grpcurl.

  # ── Microservicio: Órdenes ─────────────────────────────────────────────────
  order-service:
    build: ./services/order-service
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "9101-9103:9091"   # gRPC de cada réplica, desde el host
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://mercado:mercado@postgres:5432/mercado?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

  # ── Microservicio: Precios ─────────────────────────────────────────────────
  price-service:
    build: ./services/price-service
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "9111-9113:9092"   # gRPC de cada réplica, desde el host
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://mercado:mercado@postgres:5432/mercado?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

  # ── Microservicio: Usuarios ────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "9121-9123:9093"   # gRPC de cada réplica, desde el host
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://mercado:mercado@postgres:5432/mercado?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

  # ── Microservicio: Notificaciones (consumidor de Kafka) ────────────────────
  # No expone gRPC: su único trabajo es consumir los 4 tópicos y guardar la
  # bitácora de eventos. Se consulta en http://localhost:8080/events
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - notification-data:/data
    depends_on:
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

# ── Red interna ────────────────────────────────────────────────────────────
networks:
  mercado-net:
    driver: bridge

# ── Volúmenes persistentes para las bases de datos ────────────────────────
volumes:
  pg-data:
  notification-data:
