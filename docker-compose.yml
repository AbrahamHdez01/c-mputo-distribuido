services:

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx-gateway
    networks:
      - mercado-net

  # ── Nginx Gateway (Reverse Proxy + Load Balancer) ──────────────────────────
  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - price-service
      - user-service
      - notification-service
    networks:
      - mercado-net

  # ── Consul (Service Discovery) ─────────────────────────────────────────────
  consul:
    image: hashicorp/consul:1.18
    container_name: consul
    ports:
      - "8500:8500"     # UI y API de Consul en http://localhost:8500
    command: agent -dev -client=0.0.0.0 -ui
    networks:
      - mercado-net

  # ── Kafka (broker en modo KRaft, sin Zookeeper) ────────────────────────────
  # Un solo contenedor hace de broker Y de controller, suficiente para el
  # simulador. Dos listeners:
  #   kafka:9092       → interno, lo usan los microservicios
  #   localhost:9094   → externo, para probar desde la terminal del host
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      # Al ser un solo broker, todo lleva factor de replicación 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Kafka tarda en estar listo; nadie arranca hasta que esto pase
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - mercado-net

  # ── Kafka Init (crea los tópicos y se apaga) ───────────────────────────────
  # Contenedor de un solo uso: deja los 4 tópicos creados con 3 particiones
  # antes de que los servicios arranquen, así no se autocrean con 1 partición.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        KT=$$(command -v kafka-topics.sh || echo /opt/kafka/bin/kafka-topics.sh)
        for t in orders.created orders.filled prices.updated users.registered; do
          $$KT --bootstrap-server kafka:9092 --create --if-not-exists \
               --topic $$t --partitions 3 --replication-factor 1
        done
        echo "──────── Tópicos del simulador ────────"
        $$KT --bootstrap-server kafka:9092 --list
    networks:
      - mercado-net

  # ── Kafka UI (ver tópicos, mensajes y colas en el navegador) ───────────────
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"     # http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: simulador-mercado
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mercado-net

  # ── Go Gateway (gRPC Load Balancer) ───────────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8090:8080"   # gateway gRPC-proxy en :8090 (separado del nginx-gateway)
    depends_on:
      - order-service
      - price-service
      - user-service
    networks:
      - mercado-net

  # ── Microservicio: Órdenes ─────────────────────────────────────────────────
  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "9091:9091"   # gRPC expuesto para grpcurl desde el host
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - order-data:/data
    depends_on:
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

  # ── Microservicio: Precios ─────────────────────────────────────────────────
  price-service:
    build: ./services/price-service
    container_name: price-service
    ports:
      - "9092:9092"   # gRPC expuesto para grpcurl desde el host
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - price-data:/data
    depends_on:
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

  # ── Microservicio: Usuarios ────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "9093:9093"   # gRPC expuesto para grpcurl desde el host
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - user-data:/data
    depends_on:
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

  # ── Microservicio: Notificaciones (consumidor de Kafka) ────────────────────
  # No expone gRPC: su único trabajo es consumir los 4 tópicos y guardar la
  # bitácora de eventos. Se consulta en http://localhost:8080/events
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      - CONSUL_ADDR=consul:8500
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - notification-data:/data
    depends_on:
      consul:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mercado-net

# ── Red interna ────────────────────────────────────────────────────────────
networks:
  mercado-net:
    driver: bridge

# ── Volúmenes persistentes para las bases de datos ────────────────────────
volumes:
  order-data:
  price-data:
  user-data:
  notification-data:
