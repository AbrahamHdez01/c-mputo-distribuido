version: "3.9"

services:

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx-gateway
    networks:
      - mercado-net

  # ── Nginx Gateway (Reverse Proxy + Load Balancer) ──────────────────────────
  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - price-service
      - user-service
    networks:
      - mercado-net

  # ── Microservicio: Órdenes ─────────────────────────────────────────────────
  order-service:
    build: ./services/order-service
    container_name: order-service
    volumes:
      - order-data:/data
    networks:
      - mercado-net

  # ── Microservicio: Precios ─────────────────────────────────────────────────
  price-service:
    build: ./services/price-service
    container_name: price-service
    volumes:
      - price-data:/data
    networks:
      - mercado-net

  # ── Microservicio: Usuarios ────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    container_name: user-service
    volumes:
      - user-data:/data
    networks:
      - mercado-net

# ── Red interna ────────────────────────────────────────────────────────────
networks:
  mercado-net:
    driver: bridge

# ── Volúmenes persistentes para las bases de datos ────────────────────────
volumes:
  order-data:
  price-data:
  user-data:
